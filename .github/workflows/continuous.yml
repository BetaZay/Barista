name: Continuous

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git python3 ffmpeg nasm pkg-config \
            qt6-base-dev qt6-svg-dev libssl-dev libnl-3-dev libnl-genl-3-dev policykit-1 kmod systemd
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  deb:
    name: Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git python3 nasm pkg-config \
            qt6-base-dev qt6-svg-dev libssl-dev libnl-3-dev libnl-genl-3-dev policykit-1 kmod systemd
      - name: Build package
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel
          cpack --config build/CPackConfig.cmake -G DEB -B dist
          ARCH="$(uname -m)"
          for f in dist/*.deb; do
            if [ -f "$f" ] && [ "$f" != "dist/barista-${ARCH}.deb" ]; then
              mv "$f" "dist/barista-${ARCH}.deb"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  rpm:
    name: RPM package
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          dnf -y install cmake ninja-build git python3 nasm gcc gcc-c++ make \
            qt6-qtbase-devel qt6-qtsvg-devel openssl-devel libnl3-devel rpm-build polkit kmod systemd
      - name: Build package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel
          cpack --config build/CPackConfig.cmake -G RPM -B dist
          ARCH="$(uname -m)"
          for f in dist/*.rpm; do
            if [ -f "$f" ] && [ "$f" != "dist/barista-${ARCH}.rpm" ]; then
              mv "$f" "dist/barista-${ARCH}.rpm"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm
          if-no-files-found: error

  arch:
    name: Arch package
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake ninja git python ffmpeg \
            nasm qt6-base qt6-svg openssl libnl polkit systemd
          command -v pkcheck
      - name: Build package
        run: |
          git config --system --add safe.directory '*'
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -s /bin/bash -c "cd '$GITHUB_WORKSPACE/packaging/arch' && BARISTA_SOURCE_DIR='$GITHUB_WORKSPACE' makepkg --noconfirm --force --nodeps"
          mkdir -p dist
          ARCH="$(uname -m)"
          pkg_file=$(find packaging/arch -maxdepth 1 -name 'barista-*.pkg.tar.*' | head -n 1)
          if [ -n "$pkg_file" ]; then
            ext="${pkg_file#*pkg.tar.}"
            cp "$pkg_file" "dist/barista-${ARCH}.pkg.tar.${ext}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.*
          if-no-files-found: error

  release:
    name: Update Continuous release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, deb, rpm, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Replace rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh release delete continuous --yes --cleanup-tag 2>/dev/null || true
          gh release create continuous dist/* \
            --target "$SHA" \
            --title 'Continuous' \
            --notes "Automated build from $SHA" \
            --prerelease
